version: "3.9"

services:
  laravel:
    image: ghcr.io/andromedariwimedellin/admins-app:latest
    container_name: laravel_app
    restart: unless-stopped
    ports:
      - "8081:80"
    env_file:
      - .env
    volumes:
      - storage_data:/var/www/storage/app/public

volumes:
  storage_data:
